<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản trị · Hồ sơ người chơi</title>
<link rel="stylesheet" href="/web.css">
<style>
 body{padding:20px} .wrap{max-width:820px;margin:0 auto} h1{color:var(--gold)}
 .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#0a1918;cursor:pointer}
 .row:hover{border-color:var(--gold)} .row b{flex:1} .row small{color:var(--muted)} .tag{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--gold2);color:var(--gold)}
</style></head><body><div class="wrap">
<h1>Quản trị · Hồ sơ người chơi</h1>
<p class="muted small">Chỉ mở được trên máy chủ (link Cloudflare bị chặn). Bấm một người để xem hồ sơ của họ trên giao diện game, <b>chỉ xem</b>, không thao tác thay họ. Thoát bằng nút đỏ trên đầu trang game.</p>
<input id="q" placeholder="Tìm tên người chơi…" autofocus>
<div id="list"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('vi-VN');
const ago=t=>{if(!t)return'';const m=Math.round((Date.now()-t)/60000);return m<60?m+' phút trước':m<1440?Math.round(m/60)+' giờ trước':Math.round(m/1440)+' ngày trước'};
let timer;async function load(){const r=await fetch('/admin/players?q='+encodeURIComponent(q.value));if(!r.ok){list.innerHTML='<p class="error">Không có quyền (chỉ mở trên máy chủ).</p>';return;}
 const d=await r.json();list.innerHTML=d.map(p=>`<div class="row" data-id="${esc(p.id)}"><b>${esc(p.name)}</b>${p.web?'<span class="tag">có web</span>':''}${p.webOnly?'<span class="tag">chỉ web</span>':''}<small>${esc(p.realmName)} · ${fmt(p.totalQi)} tu vi · ${fmt(p.giftCoins)} coin · ${ago(p.lastActive)}</small></div>`).join('')||'<p class="muted">Không thấy.</p>';}
q.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
list.onclick=e=>{const r=e.target.closest('[data-id]');if(r)location.href='/admin/view?id='+encodeURIComponent(r.dataset.id)};load();
</script></body></html>
