name: Export original LIVE pet poses for V3 art review
on:
  push:
    branches:
      - feat/linh-thu-v3-true-form-art
    paths:
      - scripts/export-pet-v3-reference.mjs
      - .github/workflows/export-pet-v3-reference.yml
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/export-pet-v3-reference.mjs
      - name: Commit exact reference images encoded as text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-source/spirit-pets-v3/references/*.b64.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ref(pets-v3): export actual in-game original pose references"
          git push origin HEAD:feat/linh-thu-v3-true-form-art
