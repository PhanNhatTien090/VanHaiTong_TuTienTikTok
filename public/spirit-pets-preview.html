<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linh thú đồng hành</title><style>body{margin:0;background:#0a1422;color:#e0eee9;font:16px system-ui}main{max-width:1100px;margin:30px auto;padding:20px}canvas{width:100%;border-radius:20px}h1{color:#f2db9b}p{color:#b6ccc8}</style><main><h1>Linh Thú Cốc</h1><p>5 linh thú đồng hành · 3 tư thế chuyển động · mỗi người hiện 1 con nhỏ cạnh chân.</p><canvas id="pets" width="1100" height="560"></canvas><p>Ba con đầu: 100 / 400 / 1.000 tim. Phượng: 3.000 tim hoặc 100 coin. Thần Long: chỉ 200 coin, không nhận bằng tim. Giữ thú sau sự kiện. Gõ thu xem tiến độ, thu 1–5 đổi thú, thu an cho nghỉ.</p></main><script type="module">
import {SPIRIT_PETS,petRequirement} from './spirit-pets.js';import {drawPet,slicePetFrames} from './spirit-pet-art.js';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),scene={petArt:new Map(),motion:true,budget:{level:'light'}};
await Promise.all(SPIRIT_PETS.map(async p=>{const im=new Image();im.src='/assets/spirit-pets-v1/'+p.id+'.png';await im.decode();scene.petArt.set(p.id,slicePetFrames(im,p.id));}));
function frame(t){c.fillStyle='#0a1422';c.fillRect(0,0,1100,560);for(const [i,p]of SPIRIT_PETS.entries()){const x=110+i*220;c.fillStyle=p.color;c.textAlign='center';c.font='bold 20px system-ui';c.fillText(p.name,x,60);c.font='16px system-ui';c.fillText(p.rank,x,88);drawPet(scene,c,{x:x-85,y:255,scale:2.7,player:{id:p.id,spiritPet:p.id}},t);c.fillStyle='#b6ccc8';c.font='17px system-ui';c.fillText(petRequirement(p),x,410);c.fillText('thu '+(i+1),x,482);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
