<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thử nhận linh thú VIP</title><style>body{background:#091925;color:#f1e7c9;font:16px system-ui;text-align:center}canvas{display:block;max-height:80vh;max-width:95vw;margin:15px auto;background:linear-gradient(#0d1730,#183f46);border-radius:20px}button{background:#20384b;color:#fff0bd;border:1px solid #678b9b;padding:12px;border-radius:10px;cursor:pointer}</style><h2>Nhận linh thú VIP · bản thử</h2><p>Hỏa vũ Phượng Hoàng / Tinh Hà Thần Long → bay về cạnh chủ nhân.</p><button data-id="sun-phoenix">Kim Vũ Phượng · 300 coin</button> <button data-id="astral-dragon">Thần Long · 1.000 coin</button><canvas id="stage" width="900" height="1400"></canvas><script type="module">
import {loadPetArt} from './spirit-pet-art.js';import {petArrivalProfile,drawPetArrival,drawPetArrivalTitle} from './pet-arrival-fx.js';
const c=document.querySelector('canvas').getContext('2d'),scene={motion:true,budget:{level:'light'}},target={x:450,y:960,scale:1.8};let e;
loadPetArt(scene,[{spiritPet:'sun-phoenix'},{spiritPet:'astral-dragon'}]);
function start(id){e={petAward:true,petId:id,name:'Đạo hữu mẫu',start:performance.now()};e.duration=petArrivalProfile(e).duration;}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>start(b.dataset.id));start('sun-phoenix');
function frame(t){c.clearRect(0,0,900,1400);if(t-e.start>e.duration+1200)start(e.petId);drawPetArrival(scene,c,e,t,target,1400,'back');c.fillStyle='#b6d8d4';c.beginPath();c.ellipse(450,960,35,15,0,0,Math.PI*2);c.fill();c.font='24px system-ui';c.fillStyle='#fff5dc';c.fillText('Chủ nhân',405,1010);drawPetArrival(scene,c,e,t,target,1400,'front');drawPetArrivalTitle(c,e,t,1400);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
