<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thử hiệu ứng quà · Vân Hải Tông</title>
<style>body{margin:0;background:#080e18;color:#e9e3d3;font:16px system-ui;display:flex;justify-content:center;gap:24px;padding:20px;box-sizing:border-box}canvas{width:min(43vh,94vw);height:min(76.44vh,167.11vw);border-radius:14px;background:#111827}aside{max-width:340px}h1{font-size:23px}p{color:#acb8c8;line-height:1.6}button,a{display:inline-block;padding:12px;margin:4px;border:1px solid #4c4164;background:#21182f;color:#ffe1ad;border-radius:9px;font:inherit;cursor:pointer}button.active{background:#61412c;border-color:#e5b35e}#name{color:#ffd8a4;font-weight:bold}@media(max-width:650px){body{flex-direction:column;align-items:center}h1{margin:0}aside{max-width:500px}}</style>
<body><canvas id="scene"></canvas><aside><h1>Hiệu ứng quà mới</h1><p>Chọn mốc để xem trọn màn tung chiêu, kiếm rơi, vụ nổ và rung màn hình.</p><div id="buttons"></div><p id="name">Đang tải bộ ảnh…</p><button id="replay">Phát lại</button><p>Đây là bản xem thử riêng. Không gửi quà hoặc thay đổi dữ liệu người chơi LIVE.</p><a href="/?world=live#events">Về tab Sự kiện</a></aside>
<script type="module">
import {loadSpiritBeasts} from './gift-spirit-beasts.js';import {Scene} from './scene.js';import {GIFT_SPECTACLES,loadGiftSpectacle} from './gift-spectacle.js';
const s=new Scene(document.querySelector('canvas'),()=>{});s.zoom=1.15;s.residents=false;s.worldLife.npcs=false;s.setQuality('light');let coin=1000,serial=0;
const player={id:'preview',name:'Đạo hữu · Xem thử',realm:8,gender:'nam',giftCoins:10000,active:true,joinedAt:1,qi:20,neededQi:100,stones:10,neededStones:20};
s.update({players:[player],boss:null,environment:{id:'cosmos',name:'Tinh vực',ambience:'cosmos',layout:'float',floorY:.62,image:'/assets/worlds-v2/cosmos.png'}},null);loadGiftSpectacle(s);loadSpiritBeasts(s);
function play(value){coin=value;s.effects=[];s.luxuryQueue=[];s.fxQueue=[];s.presentation=null;const event={id:'preview-'+serial++,user:player.id,name:player.name,gift:'Quà xem thử',effect:'dragon',coins:value,count:1};s.noteEvent(event);s.addEffect(event);const q=GIFT_SPECTACLES.findLast(t=>value>=t.min);document.querySelector('#name').textContent=q.name+' · '+q.duration/1000+' giây';for(const b of document.querySelectorAll('[data-coin]'))b.classList.toggle('active',Number(b.dataset.coin)===coin);}
for(const q of GIFT_SPECTACLES){const b=document.createElement('button');b.textContent=q.min.toLocaleString('vi-VN')+' coin';b.dataset.coin=q.min;b.onclick=()=>play(q.min);document.querySelector('#buttons').append(b);}document.querySelector('#replay').onclick=()=>play(coin);
const timer=setInterval(()=>{if(s.giftSpectacleArt&&s.spiritBeasts){clearInterval(timer);play(coin);}},100);
</script></body></html>
