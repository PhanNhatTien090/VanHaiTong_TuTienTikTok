<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combo quà · một lượt lớn</title><style>body{background:#091b26;color:#ffe9bc;font:16px system-ui;text-align:center;margin:20px}canvas{width:min(100%,1100px);border:1px solid #56786c;border-radius:18px;background:linear-gradient(#152834,#1a393d)}p{color:#c2dbd2}</style><h2>Combo quà · một lần lớn hơn</h2><p>Hoa hồng ×1 / ×5 / ×10 · tổng thưởng giữ nguyên · mỗi combo chỉ một màn.</p><canvas width="1200" height="700"></canvas><p>Quà lớn chọn bậc theo tổng coin: 100 coin ×10 → hiệu ứng mốc 1.000 coin.</p><script type="module">
import {drawGiftFx} from './gift-fx.js';import {drawComboBurst} from './gift-combos.js';
const c=document.querySelector('canvas').getContext('2d');
function frame(t){c.clearRect(0,0,1200,700);for(const [i,count]of [1,5,10].entries()){c.save();c.beginPath();c.rect(i*400,0,400,700);c.clip();c.translate(i*400,0);const e={gift:'Hoa hồng',kind:'rose',coins:1,count},k=(t%4500)/4500,p={x:200,y:510,scale:1.4};drawGiftFx(c,e,t,k,p,700);drawComboBurst(c,e,t,k,p,700,true,true);c.font='bold 25px system-ui';c.textAlign='center';c.fillStyle='#ffe4a5';c.fillText('Hoa hồng ×'+count,200,55);c.fillStyle='#b8dacf';c.beginPath();c.ellipse(200,510,30,10,0,0,Math.PI*2);c.fill();c.font='18px system-ui';c.fillText('Một lượt hiệu ứng',200,610);c.restore();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
