<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phi Kiếm · Xem thử</title><link rel="stylesheet" href="/style.css"><style>html,body{margin:0;background:#080b12;height:100%;overflow:hidden}.scene-shell{position:relative;height:100dvh;width:min(56.25dvh,100vw);margin:auto;aspect-ratio:9/16}canvas{width:100%;height:100%;display:block}.tools{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);z-index:100;background:#07101eec;border:1px solid #8b4f43;border-radius:8px;padding:6px;width:min(94vw,460px);text-align:center;color:#e2d7ca;font:12px Arial}.tools button{margin:2px;background:#38232d;color:#ffe5c4;border:1px solid #a47758;border-radius:4px;padding:6px;font:12px Arial}.tools small{display:block}.tools.hide{opacity:.08}.tools.hide:hover{opacity:1}</style></head><body><main class="scene-shell"><canvas id="preview"></canvas></main><nav class="tools" id="tools"><small>XEM THỬ · Dữ liệu giả · Không mở sự kiện trên LIVE · <span id="cost"></span></small><button id="n12">12 người</button><button id="n60">60 người</button><button id="n200">200 người</button><br><button id="g1">Quà 1c</button><button id="g50">50c</button><button id="g300">300c</button><button id="g1000">1.000c</button><button id="g3000">3.000c</button><button id="finish">Trao thưởng</button><button onclick="document.querySelector('#tools').classList.toggle('hide')">Ẩn</button></nav><script type="module" src="/race-preview.js"></script></body></html>
