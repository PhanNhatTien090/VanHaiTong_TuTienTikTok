<!doctype html><html><head><meta charset="utf-8"><title>Lôi Đài quà preview</title><style>html,body{margin:0;background:#000}canvas{display:block;width:900px;height:1600px}</style></head>
<body><canvas id="c" width="900" height="1600"></canvas>
<script type="module">
// Xem thử chiếu riêng quà trợ chiêu Lôi Đài: ?trick=summon|burst|heaven&k=0.6&n=5
import {drawCutFull} from './skill-cutscene.js?v=20261118';
const q=new URLSearchParams(location.search),trick=q.get('trick')||'summon',k=+(q.get('k')||.6),canvas=document.getElementById('c'),c=canvas.getContext('2d');
const scene={canvas,motion:true,budget:{level:'full'}};
const skill=trick==='summon'?{name:'Triệu Hồi Hỏa Long',art:'fire-dragon'}:trick==='heaven'?{name:'Thiên Giáng · Khai Thiên Cự Phủ',art:'axe'}:{name:'Pháp Bảo Bạo Phát'};
const e={n:+(q.get('n')||5),by:'a',to:'b',gift:true,trick,skill,dmg:1234,ko:false,cut:{kind:'gift',trick,from:'Công Tài',ms:4400}};
let n=0;function frame(){n++;c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,900,1600);try{drawCutFull(scene,c,1e6+k*4400,1600,{e,k,ms:4400},new Map());}catch(err){document.title='ERR '+err.stack;}if(n<12)setTimeout(frame,200);}frame();
</script></body></html>
