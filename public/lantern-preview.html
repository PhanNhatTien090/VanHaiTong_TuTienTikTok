<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đêm Đèn Đồng Môn</title><style>body{background:#0b1b2a;color:#f3e6c5;font:16px system-ui;text-align:center;margin:0}canvas{display:block;width:min(95vw,520px);margin:15px auto;background:linear-gradient(#11182f,#294347);border-radius:18px}p{padding:0 15px;line-height:1.6}button{background:#23524b;color:#f5e2b1;padding:12px;border:1px solid #a9bd91;border-radius:9px;cursor:pointer}</style><h2>Đêm Đèn Đồng Môn · bản thử</h2><p>Gõ cungtu tìm bạn → mỗi người tuluyen 3 lần<br>Trả lời cungtu a / cungtu b để cùng thắp đèn.</p><button id="light">Thắp thêm một đôi đèn</button><canvas width="900" height="1250"></canvas><p>Miễn phí · chỉ ghép người đã tự nguyện vào hàng<br>Mỗi người nhận thưởng một lần/sự kiện · không tạo quan hệ đạo lữ.</p><script type="module">
import {drawLanternFestival} from './lantern-fx.js';import {drawCompanionLinks} from './companion-fx.js';
const c=document.querySelector('canvas').getContext('2d'),scene={height:1250,motion:true,budget:{level:'light'},lanternFestival:{active:true,count:1,goal:3},targets:[{id:'a',x:350,y:900},{id:'b',x:550,y:900}],companionStatus:{pairs:[{a:'a',b:'b',actions:{a:2,b:2},hearts:{a:100,b:100}}]}};
document.querySelector('button').onclick=()=>{scene.lanternFestival.count++;scene.lanternFestival.celebrated=scene.lanternFestival.count>=3;};const im=new Image();im.src='/assets/cultivators-v3.png';await im.decode();
function frame(t){c.clearRect(0,0,900,1250);drawLanternFestival(scene,c,t);drawCompanionLinks(scene,c,t);for(const [i,p]of scene.targets.entries()){c.drawImage(im,i*im.naturalWidth/5,0,im.naturalWidth/5,im.naturalHeight,p.x-65,p.y-180,130,190);c.fillStyle='#f4e5bd';c.textAlign='center';c.font='24px system-ui';c.fillText(i?'Bình':'An',p.x,p.y+55);}c.textAlign='center';c.fillStyle='#ffe0a0';c.font='bold 32px Georgia';c.fillText('ĐÊM ĐÈN ĐỒNG MÔN',450,105);c.font='24px system-ui';c.fillText(scene.lanternFestival.count+'/3 đôi đã thắp đèn',450,155);c.fillText('Cùng nghỉ tu: ngắm sao hay uống trà?',450,240);c.font='21px system-ui';c.fillText('cungtu a: Ngắm sao · cungtu b: Uống trà',450,280);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
