<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thử quà sự kiện · Vân Hải Tông</title><style>body{margin:0;background:#09111c;color:#f2e6d1;font:16px system-ui;display:flex;gap:24px;justify-content:center;padding:18px;box-sizing:border-box}canvas{width:min(45vh,94vw);height:min(80vh,167.11vw);border-radius:12px;background:#182c3f}aside{max-width:370px}h1{font-size:23px}p{color:#b2c3d6;line-height:1.6}button,a{display:inline-block;background:#192b40;color:#fbe5ba;border:1px solid #5b6384;border-radius:8px;padding:10px;margin:4px;font:inherit;cursor:pointer}.active{background:#694431}#spell{color:#ffd78e;font-weight:bold}@media(max-width:650px){body{flex-direction:column;align-items:center}}</style>
<body><canvas></canvas><aside><h1>Quà trong sự kiện</h1><div><button id="race">Đua phi kiếm</button><button id="duel">Tỷ thí</button></div><p>Chọn mốc quà để xem luồng bứt tốc hoặc chiêu thức tung ra theo từng đợt.</p><div id="coins"></div><p id="spell">Đang tải ảnh…</p><button id="replay">Phát lại</button><p>Bản xem thử độc lập, không thay đổi người chơi hoặc sự kiện đang LIVE.</p><a href="/?world=live#events">Về tab Sự kiện</a></aside><script type="module">
import {loadSpiritBeasts} from './gift-spirit-beasts.js';import {Scene} from './scene.js';import {EVENT_GIFT_TIERS,loadEventGiftArt} from './event-gift-fx.js';
const scene=new Scene(document.querySelector('canvas'),()=>{});scene.residents=false;scene.worldLife.npcs=false;scene.setQuality('light');scene.zoom=1;let mode='race',value=1000,serial=0,giftFx=[],start=Date.now();
const players=Array.from({length:6},(_,i)=>({id:'p'+i,name:['Thanh Vân','Ngọc Hà','Thiên Phong','Linh Nhi','Hạo Nhiên','Vân Du'][i],realm:6+i%3,gender:i%2?'nu':'nam',giftCoins:i?100:10000,active:true,joinedAt:i,qi:10,neededQi:100,stones:10,neededStones:20}));
function update(){const now=Date.now(),race=mode==='race';scene.update({players:race?players:players.slice(0,2),serverNow:now,boss:null,raceStatus:race?{id:'preview-race',active:true,phase:'running',racers:players.map((p,i)=>({id:p.id,name:p.name,lane:i,at:i,startedAt:start,speed:11.5,bonus:i===0?80:0,boostUntil:i===0?now+1000:0})),giftFx}:null,raceStage:race?players.map(p=>p.id):[],socialScene:race?null:'tournament',socialStage:race?[]:['p0','p1'],socialStatus:race?{}:{tournament:{current:{id:'preview-duel',a:'p0',b:'p1',startedAt:start,endsAt:now+60000,techniques:{},giftFx}}},environment:{id:mode,name:'Xem thử',image:'/assets/events-v1/'+(race?'race':'tournament')+'-background.png'}},null);}
function play(v=value){value=v;scene.eventGiftQueue=null;giftFx=[{id:'preview-'+serial++,user:'p0',name:players[0].name,value,mode,at:Date.now(),fighter:true,boost:4}];update();const q=EVENT_GIFT_TIERS.findLast(x=>value>=x.min);document.querySelector('#spell').textContent=q.name+' · '+value.toLocaleString('vi-VN')+' coin';for(const b of document.querySelectorAll('[data-coin]'))b.classList.toggle('active',Number(b.dataset.coin)===value);document.querySelector('#race').classList.toggle('active',mode==='race');document.querySelector('#duel').classList.toggle('active',mode==='duel');}
for(const v of [...EVENT_GIFT_TIERS.map(t=>t.min),5000,10000]){const b=document.createElement('button');b.dataset.coin=v;b.textContent=v.toLocaleString('vi-VN');b.onclick=()=>play(v);document.querySelector('#coins').append(b);}for(const kind of ['race','duel'])document.querySelector('#'+kind).onclick=()=>{mode=kind;play();};document.querySelector('#replay').onclick=()=>play();update();loadEventGiftArt(scene);loadSpiritBeasts(scene);setInterval(update,500);const timer=setInterval(()=>{if(scene.eventGiftArt&&scene.spiritBeasts){clearInterval(timer);play();}},100);
</script></body></html>
