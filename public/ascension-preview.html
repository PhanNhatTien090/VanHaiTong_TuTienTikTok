<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiên đài · Xem thử</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ascension-stage.css"><style>
html,body{margin:0;background:#08152b;height:100%;overflow:hidden}.scene-shell{position:relative;height:100dvh;width:min(56.25dvh,100vw);margin:auto;container-type:inline-size}canvas{width:100%;height:100%;display:block}.preview-tools{position:fixed;top:12px;right:12px;z-index:100;max-width:220px;background:#07172fee;border:1px solid #a6d1c750;border-radius:12px;padding:10px;color:#d8e9e8;font:12px/1.5 Arial,sans-serif}.preview-tools summary{cursor:pointer}.preview-tools select,.preview-tools button{display:block;width:100%;margin-top:8px;padding:8px;background:#1c394e;color:#e4efdf;border:1px solid #b6d4be55;border-radius:7px}.preview-tools small{display:block;margin-top:8px;color:#a4bbc8}.preview-tools[hidden]{display:none}
</style></head><body class="ascension-stage"><main class="scene-shell"><canvas id="preview" aria-label="Thiên đài đột phá"></canvas></main><details class="preview-tools" open><summary>Xem thử thiên đài</summary><select id="realm" aria-label="Cảnh giới"></select><button id="ritual">Xem đột phá</button><button id="idle">Về thiên đài</button><button id="sound">Bật âm thanh</button><small>Dữ liệu xem thử · không ghi vào LIVE</small></details><script type="module" src="/ascension-preview.js"></script></body></html>
